# Builds the app for every platform and publishes a GitHub Release with the
# updater feed (latest.json). Trigger: push a tag `v*`, or run by hand.
#
# The jobs, in order: `build` (four in parallel, each uploading its bundles
# and their .sig files), then `feed` (latest.json, written once from those
# signatures) and `smoke-windows`, then `verify` (checks it all, marks the
# feed verified, promotes the release).
#
# What each job needs and why (docs/research/tauri-packaging.md §6):
# - the method repo checked out beside this one: the method files are bundled
#   as prose, and the engine's differential tests spawn its Python tools;
# - Node 24 for the engine build and tests (node:sqlite), and the official
#   node binary of the target as the app's sidecar (prepare-bundle stages it);
# - TAURI_SIGNING_PRIVATE_KEY: the updater's minisign key. Not Apple signing;
#   the app is deliberately unsigned for Gatekeeper (docs/APP.md).
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest,   triple: aarch64-apple-darwin,       args: '--target aarch64-apple-darwin --bundles app,dmg', test: true }
          - { os: macos-latest,   triple: x86_64-apple-darwin,        args: '--target x86_64-apple-darwin --bundles app,dmg' }
          - { os: windows-latest, triple: x86_64-pc-windows-msvc,     args: '--bundles nsis' }
          - { os: ubuntu-22.04,   triple: x86_64-unknown-linux-gnu,   args: '--bundles appimage,deb' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: APE
      - uses: actions/checkout@v4
        with:
          repository: planetjc/anki-process-engine-live
          path: Anki

      - if: startsWith(matrix.os, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Third-party actions are pinned to a commit, not a tag: this job holds
      # a write token and tauri-action runs with the updater's signing key in
      # its environment, and a tag can be moved to other code. Bump by SHA.
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: ${{ matrix.triple }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: 'APE/app/src-tauri -> target'

      # The engine suite reopens .apkg files with the system `unzip` and spawns
      # `python3` for the differential tests -- tooling the Windows and Linux
      # runners lack or ship differently. The engine is pure Node and identical
      # on every platform, so it is tested once, on the Apple silicon job;
      # the others build and typecheck it.
      - name: engine — build and typecheck
        working-directory: APE
        run: |
          npm ci
          npm run typecheck
      - name: engine — test
        if: matrix.test
        working-directory: APE
        env:
          APE_ENGINE_REPO: ${{ github.workspace }}/Anki
        run: npm test

      - name: app — stage the bundle inputs (node sidecar, npm, engine, method files)
        working-directory: APE/app
        env:
          APE_TARGET_TRIPLE: ${{ matrix.triple }}
          APE_METHOD_DIR: ${{ github.workspace }}/Anki/method
        run: |
          npm ci
          node scripts/prepare-bundle.mjs

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APE_METHOD_DIR: ${{ github.workspace }}/Anki/method
        with:
          projectPath: APE/app
          tagName: v__VERSION__
          releaseName: 'AnkiEngine v__VERSION__'
          releaseBody: |
            Download for your platform below. This is free software and the builds are
            not notarized with Apple, so on macOS the first launch is: double-click →
            "cannot be opened" → System Settings → Privacy & Security → **Open Anyway**,
            once. Windows shows a SmartScreen warning: **More info → Run anyway**.

            Already installed? The app updates itself. On a Mac that had the app
            before it was called AnkiEngine, installing from the download instead
            leaves the old APE.app beside the new one: delete APE.app afterwards.
          releaseDraft: false
          # A prerelease until `verify` promotes it. GitHub's "latest" is what
          # the download page, its links (releases/latest/download/...) and the
          # oldest builds' updater all read, and a prerelease is never latest:
          # a release that is still uploading, or that failed its checks, is
          # not what anyone downloads.
          prerelease: true
          # Not here: four jobs each merging their entry into one shared
          # latest.json race, and the loser's platform drops out of the feed
          # (v0.1.2, v0.1.8). The `feed` job writes it once, after all four.
          includeUpdaterJson: false
          args: ${{ matrix.args }}

      # Version-free copies, so a link written once keeps working:
      # https://github.com/planetjc/ankiengine/releases/latest/download/AnkiEngine-<platform>.<ext>
      - name: stable-name copies on the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          cd APE/app/src-tauri/target
          tag="${GITHUB_REF_NAME}"
          copy() { src=$(ls $1 2>/dev/null | head -1); [ -n "$src" ] || return 0; cp "$src" "$2"; gh release upload "$tag" "$2" --clobber --repo "$GITHUB_REPOSITORY"; }
          case "${{ matrix.triple }}" in
            aarch64-apple-darwin)      copy 'aarch64-apple-darwin/release/bundle/dmg/*.dmg' AnkiEngine-macos-arm64.dmg ;;
            x86_64-apple-darwin)       copy 'x86_64-apple-darwin/release/bundle/dmg/*.dmg' AnkiEngine-macos-intel.dmg ;;
            x86_64-pc-windows-msvc)    copy 'release/bundle/nsis/*-setup.exe' AnkiEngine-windows-x64-setup.exe ;;
            x86_64-unknown-linux-gnu)  copy 'release/bundle/appimage/*.AppImage' AnkiEngine-linux-x64.AppImage; copy 'release/bundle/deb/*.deb' AnkiEngine-linux-x64.deb ;;
          esac

  # The updater feed, from every signature the build jobs uploaded. One job
  # writes the whole file, so there is nothing to race; the script says why
  # tauri-action's own feed could not be used, and what shape it keeps.
  #
  # It runs even when a build failed, and writes whatever the release holds:
  # `verify` is what names the missing platform. Re-running a build job
  # re-runs this one after it, and `verify` compares every signature in the
  # feed with the .sig on the release, so a rebuilt bundle cannot ship
  # behind an old one.
  feed:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: write latest.json from the release's signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          node .github/release/updater-feed.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" > latest.json
          gh release upload "$GITHUB_REF_NAME" latest.json --repo "$GITHUB_REPOSITORY" --clobber

  # The Windows build, installed the way a user on the previous release gets
  # it, and started. Two ways to ship a broken Windows app pass every other
  # check, because every other check reads files, not an installed app:
  # - v0.1.0 through v0.1.6 shipped an engine that never started on Windows
  #   (a \\?\ path, sidecar.rs). windows-engine.mjs starts the install and
  #   asks whether the engine is running.
  # - Renaming the product to AnkiEngine moved the install from
  #   %LOCALAPPDATA%\APE to %LOCALAPPDATA%\AnkiEngine, so an upgrade can leave
  #   the old app behind, or take the user's data with it.
  #   windows-upgrade.mjs installs the previous release, then this one over
  #   it, and checks what is left.
  # A failure of either also holds back `verify`'s mark and promotion, so
  # neither installs already out there nor new downloads get the broken build.
  smoke-windows:
    needs: build
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Two installs, two downloads and the engine check take a few minutes; a
    # stuck installer must not hold the release unpromoted for six hours.
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.12.0'
      - name: upgrade from the previous release to the released Windows build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/smoke/windows-upgrade.mjs
      - name: its engine starts and stays up
        run: node .github/smoke/windows-engine.mjs

  # A release that looks complete can still be broken. Until the `feed` job,
  # the four matrix jobs each merged their entry into latest.json themselves,
  # and two finishing together lost one ("Not Found - /releases/assets").
  # v0.1.2 shipped that way: the arm64 job died after uploading its bundles
  # but before merging its entry, so latest.json carried no darwin-aarch64.
  # The release page looked right, every file was there bar one, and every
  # Apple silicon install would have sat on the old version forever without
  # an error anywhere. That race is gone, but a build can still fail or an
  # upload go missing, and this is the step that makes it loud instead of
  # silent.
  #
  # It runs even when a build job failed (always()), because that is exactly
  # when the release needs checking. To repair: "Re-run failed jobs". GitHub
  # re-runs what needs the failed job -- `feed`, `smoke-windows` and this one
  # -- after it; and if `feed` were ever skipped, the signature check below
  # would say so rather than pass an old feed.
  verify:
    needs: [build, feed, smoke-windows]
    if: always() && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # write: it attaches, or withdraws, the verified feed on the release.
      contents: write
      # `gh workflow run pages` below: without it the dispatch is a 403, the
      # job goes red on a complete release, and the site keeps the old feed.
      actions: write
    steps:
      # The site publishes only a feed this job has attached (pages.yml), and
      # downloads come only from a release it has promoted. A re-run starts
      # by taking both back, so a release that fails on a second look is no
      # longer offered either way.
      - name: withdraw any earlier verification
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete-asset "$GITHUB_REF_NAME" verified-feed.json --repo "$GITHUB_REPOSITORY" --yes || true
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --prerelease

      # First, because everything below reads latest.json: if `feed` did not
      # write it this time, what is on the release is an older feed, and a
      # rebuilt bundle's new signature is not in it.
      - name: the feed was written
        if: needs.feed.result != 'success'
        run: |
          echo "::error::feed did not pass (${{ needs.feed.result }}); latest.json on the release is not this run's. Fix, re-run feed, then re-run this job."
          exit 1

      - name: the release covers every platform
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          tag="${GITHUB_REF_NAME}"
          repo="${GITHUB_REPOSITORY}"
          bad=0

          gh release download "$tag" --repo "$repo" --pattern latest.json --output latest.json --clobber \
            || { echo "::error::$tag has no latest.json — nothing can update"; exit 1; }

          # The updater looks itself up by platform key. A missing one is not a
          # degraded update, it is no update at all, and it is silent.
          for p in darwin-aarch64 darwin-x86_64 linux-x86_64 windows-x86_64; do
            if ! jq -e --arg p "$p" '.platforms | has($p)' latest.json >/dev/null; then
              echo "::error::latest.json has no $p entry — installs on that platform will never be offered $tag"
              bad=1
            fi
          done

          if ! jq -e '.platforms | to_entries | all(.value.url != "" and .value.signature != "")' latest.json >/dev/null; then
            echo "::error::latest.json has an entry with an empty url or signature"
            bad=1
          fi

          # Each entry's signature has to be the one now beside its bundle. A
          # rebuilt bundle is signed afresh, so a feed older than its bundles
          # names files the updater will then refuse, and says nothing.
          mkdir sigs
          gh release download "$tag" --repo "$repo" --pattern '*.sig' --dir sigs
          while IFS=$'\t' read -r key file; do
            if [ ! -f "sigs/$file.sig" ] || ! cmp -s <(jq -j --arg k "$key" '.platforms[$k].signature' latest.json) "sigs/$file.sig"; then
              echo "::error::latest.json's $key signature is not $file.sig as it is on the release now"
              bad=1
            fi
          done < <(jq -r '.platforms | to_entries[] | "\(.key)\t\(.value.url | split("/") | last)"' latest.json)

          want="${tag#v}"
          got=$(jq -r .version latest.json)
          if [ "$got" != "$want" ]; then
            echo "::error::latest.json says version $got but the tag is $want"
            bad=1
          fi

          # The stable names are what the download page links to; the versioned
          # bundles being present says nothing about these.
          names=$(gh release view "$tag" --repo "$repo" --json assets --jq '.assets[].name')
          for a in AnkiEngine-macos-arm64.dmg AnkiEngine-macos-intel.dmg AnkiEngine-windows-x64-setup.exe AnkiEngine-linux-x64.AppImage AnkiEngine-linux-x64.deb; do
            if ! grep -qx "$a" <<<"$names"; then
              echo "::error::$a is missing from $tag — the download page links to it"
              bad=1
            fi
          done

          if [ "$bad" -ne 0 ]; then
            echo "::error::$tag is incomplete. Re-run failed jobs; feed and this job re-run after the builds."
            exit 1
          fi
          echo "$tag is complete: every platform in latest.json, every stable-name asset present."

      - name: the Windows build upgrades and runs
        if: needs.smoke-windows.result != 'success'
        run: |
          echo "::error::smoke-windows did not pass (${{ needs.smoke-windows.result }}); the updater feed is left on the previous release. Fix, re-run smoke-windows, then re-run this job."
          exit 1

      # The mark pages.yml looks for: the very feed checked above, attached
      # only once every check here has passed. Every other way the site gets
      # rebuilt -- any push to main -- can publish this and nothing newer.
      - name: mark the feed verified
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp latest.json verified-feed.json
          gh release upload "$GITHUB_REF_NAME" verified-feed.json --repo "$GITHUB_REPOSITORY" --clobber

      # Out of prerelease, and "latest" if no promoted release is newer: set
      # explicitly either way, since re-verifying an old release must not
      # hand it the download page back.
      - name: promote the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          repo="$GITHUB_REPOSITORY"
          promoted=$(gh release list --repo "$repo" --exclude-drafts --exclude-pre-releases --limit 100 --json tagName --jq '.[].tagName' | grep -vx "$tag" || true)
          newest=$(printf '%s\n' "$tag" $promoted | sort -V | tail -1)
          if [ "$newest" = "$tag" ]; then latest=true; else latest=false; fi
          gh release edit "$tag" --repo "$repo" --prerelease=false --latest=$latest
          echo "$tag promoted (latest: $latest)"

      # The feed the app actually reads is the copy on ankiengine.com, so a
      # release is not finished until the site has been rebuilt with it.
      - name: refresh the updater feed on the site
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run pages --repo "$GITHUB_REPOSITORY" --ref main
